# baseline：完整上下文、不自动重试、不注入修复提示。
# 这是对照组；其他配置只改一个变量，才能判断差异来自哪里。
name: baseline
description: Full context, no tool retry, no repair hint.
model: deepseek-chat
instruction: |
  You are a careful autonomous agent. Complete the task exactly as specified.
  Prefer reading real files over guessing. Keep intermediate work in the workspace.
tools:
  - list_files
  - read_file
  - write_file
  - http_get
  - run_python
max_steps: 8
temperature: 0.0
max_tokens: 900
context_policy: full
tool_retries: 0
repair_on_error: false
